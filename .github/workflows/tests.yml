name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      # offline test mode: no embedding model download, no LLM calls
      - run: pip install pdfplumber pypdf faiss-cpu openai pyyaml pandas numpy pyarrow pyspark pytest reportlab
      - run: pytest -q tests
